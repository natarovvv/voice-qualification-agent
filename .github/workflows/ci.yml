# The tests are only worth having if something runs them without being asked.
#
# requirements.lock rather than requirements.txt on purpose: the lock is the
# core path, and requirements.txt would pull silero-vad and faster-whisper -
# torch and CUDA wheels, gigabytes, for two fallbacks the tests stub out anyway.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    # The drop-timer hold is a race between workers, and fakeredis cannot lose
    # a race - it runs every command straight through. This one can.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"  # what the suite is developed against
          cache: pip
          cache-dependency-path: server/requirements.lock
      - run: pip install -r server/requirements.lock
      - name: pytest
        working-directory: server
        # No provider keys here, and none needed: conftest blanks them, the
        # live tests skip themselves, and pgserver brings its own PostgreSQL.
        run: pytest -q

  # The deploy is the part of a repo that rots without anyone noticing: no other
  # job here fails if the Dockerfile stops building, or if the page comes up
  # unable to reach the server. --wait returns when the healthchecks pass, so
  # this is the stack answering rather than an image that merely built.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait
      # --wait already blocked on the container's healthcheck, which is /ready,
      # so this asserts the half that matters: it reached both backing stores.
      - run: curl -fsS http://localhost:8000/ready | grep -q '"storage":"ok","sessions":"ok"'
      - run: curl -fsS http://localhost:3000 | grep -q "Start call"
      - name: server log
        if: always()
        run: docker compose logs server
      - if: always()
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # next build type-checks the whole app, tests included; a separate tsc
      # pass would be the same work twice.
      - run: npm run build
        working-directory: web
